<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>光影對決｜戰鬥</title>
<style>
  :root { --panel-bg: rgba(0, 0, 0, 0.8); --glow-O: 0 0 30px #f6d26a; --glow-X: 0 0 30px #9a7bff; }
  body { margin:0;padding:0;width:100vw;height:100vh;color:white;font-family:"Microsoft JhengHei",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050816;overflow:hidden;position:relative; }
  .bg-layer { position:fixed; inset:0; background:#050816 url('Gemini_Generated_Image_axefmzaxefmzaxef.jpg') center/cover no-repeat; filter: brightness(0.3); z-index:-2; }
  #topbar{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:9999}
  .pill{background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 14px;backdrop-filter:blur(8px)}
  #turnText{font-weight:900}
  #timer-container { font-size:2rem; font-weight:bold; color:#00d4ff; padding:10px 34px; background:var(--panel-bg); border:4px solid #00d4ff; border-radius:60px; margin-bottom:25px; box-shadow:0 0 30px #00d4ff; }
  .game-main { display:flex; align-items:center; justify-content:center; gap:20px; width:95%; max-width:1400px; }
  .hp-visual-container { position:relative; width:100px; height:450px; }
  .hp-img-base { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:contain; }
  .hp-bg { filter:brightness(0.2); z-index:1; }
  .hp-fill { z-index:2; transition:clip-path 0.25s ease-out; clip-path:inset(0% 0 0 0); }
  .defending-bar { filter:drop-shadow(0 0 15px #00d4ff) brightness(1.2)!important; }
  .hp-text { position:absolute; width:100%; text-align:center; font-size:1.2rem; font-weight:900; color:#fff; text-shadow:0 0 8px #000; z-index:10; transition:top 0.25s; }
  .side-panel { position:relative; display:flex; align-items:center; gap:20px; background:var(--panel-bg); padding:25px; border-radius:35px; border:3px solid rgba(255,255,255,0.05); transition:all 0.3s ease; }
  .avatar { width:140px; height:260px; border-radius:20px; object-fit:cover; border:3px solid rgba(255,255,255,0.2); filter:brightness(0.4); transition:all 0.3s ease; }
  .active-side-O .avatar { filter:brightness(1); border-color:#f6d26a; box-shadow:var(--glow-O); }
  .active-side-X .avatar { filter:brightness(1); border-color:#9a7bff; box-shadow:var(--glow-X); }
  .active-side-O { border-color:rgba(246,210,106,0.5)!important; transform:scale(1.05); }
  .active-side-X { border-color:rgba(154,123,255,0.5)!important; transform:scale(1.05); }
  .sp-column-vertical { display:flex; flex-direction:column-reverse; gap:15px; }
  .sp-dot { width:45px; height:45px; background-size:contain; background-repeat:no-repeat; transition:0.2s; }
  .sp-on { background-image:url('sp_on.png'); background-color:#00d4ff; border-radius:50%; box-shadow:0 0 15px #00d4ff; }
  .sp-off { background-image:url('sp_off.png'); background-color:#333; border-radius:50%; opacity:0.2; }
  .board { display:grid; grid-template-columns:repeat(3,140px); grid-template-rows:repeat(3,140px); gap:15px; padding:25px; background:rgba(255,255,255,0.05); border-radius:30px; border:2px solid rgba(255,255,255,0.1); backdrop-filter:blur(10px); }
  .cell { background:rgba(0,0,0,0.75); border-radius:18px; display:flex; align-items:center; justify-content:center; font-size:4.5rem; font-weight:bold; cursor:pointer; transition:0.2s; }
  .cell.O { color:#f6d26a; text-shadow:var(--glow-O); }
  .cell.X { color:#9a7bff; text-shadow:var(--glow-X); }
  .skill-footer { margin-top:40px; display:flex; align-items:center; gap:40px; background:var(--panel-bg); padding:25px 60px; border-radius:80px; border:4px solid rgba(255,255,255,0.15); }
  .skill-label { font-size:1.8rem; font-weight:bold; color:#00d4ff; border-right:4px solid #555; padding-right:35px; }
  .skill-list { display:flex; gap:25px; }
  .s-btn { width:240px; height:110px; border:none; border-radius:25px; cursor:not-allowed; background-size:cover; background-position:center; color:white; opacity:0.4; filter:brightness(0.6); transition:all 0.3s; }
  .s-btn.active { cursor:pointer; opacity:1; filter:brightness(1); transform:translateY(-5px); border:3px solid #00d4ff; box-shadow:0 0 20px rgba(0,212,255,0.6); }
  .btn-atk { background-image:url('skill_atk.png'); } .btn-def { background-image:url('skill_def.png'); } .btn-hel { background-image:url('skill_hel.png'); } .btn-stn { background-image:url('skill_stn.png'); }
  .identity-badge { position:absolute; top:10px; left:50%; transform:translateX(-50%); padding:6px 12px; border-radius:999px; font-size:0.95rem; font-weight:900; letter-spacing:1px; background:rgba(0,0,0,0.72); border:1px solid rgba(255,255,255,0.18); z-index:12; }
  .identity-badge.me { color:#7CFFB2; border-color:rgba(124,255,178,0.45);} .identity-badge.enemy { color:#FF8F8F; border-color:rgba(255,143,143,0.45);} .side-panel.my-side { box-shadow:0 0 0 3px rgba(124,255,178,0.22),0 0 26px rgba(124,255,178,0.18);} .side-panel.enemy-side { box-shadow:0 0 0 3px rgba(255,143,143,0.15),0 0 22px rgba(255,143,143,0.12); opacity:0.92; }
  .board-wrap, .skill-footer-wrap { position:relative; }
  .action-lock-mask { position:absolute; inset:0; border-radius:30px; display:none; align-items:center; justify-content:center; text-align:center; padding:20px; background:rgba(5,8,22,0.45); backdrop-filter:blur(2px); color:#fff; font-weight:900; letter-spacing:1px; z-index:20; border:2px solid rgba(255,255,255,0.12); }
  .skill-footer-wrap .action-lock-mask { border-radius:80px; }
  .interaction-locked .action-lock-mask { display:flex; }
  .interaction-locked .board, .interaction-locked .skill-footer { filter:grayscale(0.3) brightness(0.72); }
  .interaction-locked .board, .interaction-locked .skill-footer { pointer-events:none; }
  #overlayWait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,7,18,.62);backdrop-filter:blur(6px);z-index:9998}
  #overlayWait .box{background:rgba(0,0,0,.78);padding:28px 30px;border-radius:24px;text-align:center;border:1px solid rgba(255,255,255,.18)}
</style>
</head>
<body>
<div class="bg-layer"></div>
<div id="topbar">
  <div class="pill">房號：<strong id="roomCode"></strong></div>
  <div class="pill" id="turnText">讀取中…</div>
</div>
<div id="timer-container">--</div>
<div class="game-main">
  <div class="hp-visual-container"><div id="hp-val-O" class="hp-text">100%</div><img src="left-hp-bar.png" class="hp-img-base hp-bg"><img src="left-hp-bar.png" id="hp-fill-O" class="hp-img-base hp-fill"></div>
  <div class="side-panel" id="panel-O"><div class="identity-badge" id="badge-O">光 / O</div><img src="image_ba490a.png" class="avatar" alt="P1"><div class="sp-column-vertical" id="sp-display-O"></div></div>
  <div class="board-wrap" id="board-wrap"><div class="board" id="board"></div><div class="action-lock-mask" id="board-lock-mask">等待對手回合</div></div>
  <div class="side-panel" id="panel-X"><div class="identity-badge" id="badge-X">影 / X</div><div class="sp-column-vertical" id="sp-display-X"></div><img src="image_ba4947.png" class="avatar" alt="P2"></div>
  <div class="hp-visual-container"><div id="hp-val-X" class="hp-text">100%</div><img src="right-hp-bar.png" class="hp-img-base hp-bg"><img src="right-hp-bar.png" id="hp-fill-X" class="hp-img-base hp-fill"></div>
</div>
<div class="skill-footer-wrap" id="skill-footer-wrap"><div class="skill-footer" id="skill-footer"><div class="skill-label">戰技命令</div><div class="skill-list" id="skill-list-container"></div></div><div class="action-lock-mask" id="skill-lock-mask">不是你的操作階段</div></div>
<div id="overlayWait"><div class="box"><h2>等待戰鬥狀態…</h2><div id="overlayMsg">讀取房間資料中</div></div></div>
<script type="module" src="./battle.js"></script>
</body>
</html>
